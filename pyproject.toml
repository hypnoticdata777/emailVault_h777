[project]
name = "email-vault-poc"
version = "0.1.0"
description = "Foundation for a Gmail thread preservation proof of concept."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.116.0",
    "google-auth[requests]>=2.30.0",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.35.0",
]
renderer = [
    "playwright",
]
test = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
