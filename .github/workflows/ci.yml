name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"

      - name: Run stable test suite
        run: python -m unittest discover -s tests

      - name: Validate Dockerfile can build
        run: docker build -t email-vault-api:ci .
